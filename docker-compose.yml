services:
  processor:
    image: neuro-report:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - dev.env
    mem_limit: 2g
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ${INPUT_HOST:-./data/fixture/linked}:/data/input:ro
      - ./data/output:/data/output
